<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WoozleScape - Glass</title>
<style>
  /* ===== USER CONFIG ===== */
:root {
  --cycle: 60s;
  --interval: 5s;
  --logo-width: 30%;
  --horizon: 50%;
  --gap: 15px;
  --reflection-opacity: 0.4;
  --reflection-blur: 1px;
  --refl-fade-start: 0.6;
  --refl-fade-mid: 0.4;
  --refl-fade-mid-pos: 67%;
  --refl-fade-end-pos: 100%;
  --glow-opacity: 0.0;
  --glow-color: 209;

    /* o piece geometry — derived from logo PNG, do not change */
    --o1-left: 34.20%;
    --o2-left: 41.73%;
    --o-top: 35.65%;
    --o-width: 7.20%;
    --o-height: 35.02%;
    --o-swap-translate: 104.63%;
  }

  /* ===== CONTROL PANEL VISIBILITY =====
     Set to `block` to show the tuning panel. `none` for production. */
  .controls { display: block; }

  /* ======================================== */

  html, body {
    margin: 0; padding: 0;
    width: 100vw; height: 100vh;
    background: #000;
    overflow: hidden;
    font-family: 'Inter', -apple-system, sans-serif;
    color: #fff;
  }

  .floor {
    position: fixed;
    left: 0; right: 0;
    top: var(--horizon); bottom: 0;
    background: linear-gradient(180deg,
      rgba(255,255,255,0.04) 0%,
      rgba(255,255,255,0) 8%,
      rgba(0,0,0,0) 60%,
      rgba(0,0,0,0.4) 100%);
    pointer-events: none;
  }

  .horizon-line {
    position: fixed;
    left: 0; right: 0;
    top: var(--horizon);
    height: 1px;
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(255,255,255,0.15) 30%,
      rgba(255,255,255,0.3) 50%,
      rgba(255,255,255,0.15) 70%,
      transparent 100%);
    transform: translateY(-1px);
    pointer-events: none;
    z-index: 3;
    overflow: hidden;
  }

  .pool {
    position: fixed;
    left: 50%;
    top: var(--horizon);
    transform: translate(-50%, -10%);
    width: 90vw;
    height: 30vh;
    background: radial-gradient(ellipse 50% 50% at center top,
      hsla(var(--glow-color), 70%, 50%, calc(var(--glow-opacity) * 0.5)) 0%,
      transparent 70%);
    filter: blur(40px);
    mix-blend-mode: screen;
    pointer-events: none;
    z-index: 1;
  }

  .logo-wrap {
    position: fixed;
    left: 50%;
    top: var(--horizon);
    transform: translate(-50%, -100%) translateY(calc(var(--gap) * -0.5));
    width: var(--logo-width);
    z-index: 4;
    filter: drop-shadow(0 0 40px hsla(var(--glow-color), 80%, 50%, var(--glow-opacity)));
    pointer-events: none;
    perspective: 1200px;
  }

  .logo-reflection-wrap {
    position: fixed;
    left: 50%;
    top: var(--horizon);
    transform: translateX(-50%) translateY(calc(var(--gap) * 0.5));
    width: var(--logo-width);
    z-index: 2;
    pointer-events: none;
    perspective: 1200px;
    opacity: var(--reflection-opacity);
    filter: blur(var(--reflection-blur));
    -webkit-mask-image: linear-gradient(180deg,
      rgba(0,0,0, var(--refl-fade-start)) 0%,
      rgba(0,0,0, var(--refl-fade-mid)) var(--refl-fade-mid-pos),
      rgba(0,0,0, 0) var(--refl-fade-end-pos));
    mask-image: linear-gradient(180deg,
      rgba(0,0,0, var(--refl-fade-start)) 0%,
      rgba(0,0,0, var(--refl-fade-mid)) var(--refl-fade-mid-pos),
      rgba(0,0,0, 0) var(--refl-fade-end-pos));
  }

  .refl-animator {
    width: 100%;
    transform-origin: top center;
  }
  .refl-animator .logo-reflection,
  .refl-animator .logo-reflection-no-o {
    transform: scaleY(-1);
    transform-origin: center;
  }
  .o-piece-refl {
    transform: scaleY(-1);
  }

  .logo-real, .logo-reflection {
    width: 100%;
    height: auto;
    display: block;
    position: relative;
    z-index: 1;
  }

  .logo-no-o, .logo-reflection-no-o {
    width: 100%;
    height: auto;
    display: none;
    position: relative;
    z-index: 1;
  }
  body.mode-swap .logo-real,
  body.mode-swap .logo-reflection,
  body.mode-swap-3d .logo-real,
  body.mode-swap-3d .logo-reflection { display: none; }
  body.mode-swap .logo-no-o,
  body.mode-swap .logo-reflection-no-o,
  body.mode-swap-3d .logo-no-o,
  body.mode-swap-3d .logo-reflection-no-o { display: block; }

  .o-piece {
    position: absolute;
    width: var(--o-width);
    height: var(--o-height);
    top: var(--o-top);
    display: none;
    z-index: 2;
  }
  .o-piece-refl {
    position: absolute;
    width: var(--o-width);
    height: var(--o-height);
    top: calc(100% - var(--o-top) - var(--o-height));
    display: none;
    z-index: 2;
  }
  body.mode-swap .o-piece,
  body.mode-swap .o-piece-refl,
  body.mode-swap-3d .o-piece,
  body.mode-swap-3d .o-piece-refl { display: block; }

  .o-1, .o-1-refl { left: var(--o1-left); }
  .o-2, .o-2-refl { left: var(--o2-left); }

  body.mode-swap .o-1 {
    animation: swap-1 var(--interval) cubic-bezier(0.65, 0, 0.35, 1) 1 forwards;
  }
  body.mode-swap .o-2 {
    animation: swap-2 var(--interval) cubic-bezier(0.65, 0, 0.35, 1) 1 forwards;
  }
  body.mode-swap .o-1-refl {
    animation: swap-1-refl var(--interval) cubic-bezier(0.65, 0, 0.35, 1) 1 forwards;
  }
  body.mode-swap .o-2-refl {
    animation: swap-2-refl var(--interval) cubic-bezier(0.65, 0, 0.35, 1) 1 forwards;
  }

  @keyframes swap-1 {
    0%, 50%   { transform: translate(0, 0); }
    75%       { transform: translate(var(--o-swap-translate), 0); }
    100%      { transform: translate(0, 0); }
  }
  @keyframes swap-2 {
    0%, 50%   { transform: translate(0, 0); }
    75%       { transform: translate(calc(var(--o-swap-translate) * -1), 0); }
    100%      { transform: translate(0, 0); }
  }
  @keyframes swap-1-refl {
    0%, 50%   { transform: scaleY(-1) translate(0, 0); }
    75%       { transform: scaleY(-1) translate(var(--o-swap-translate), 0); }
    100%      { transform: scaleY(-1) translate(0, 0); }
  }
  @keyframes swap-2-refl {
    0%, 50%   { transform: scaleY(-1) translate(0, 0); }
    75%       { transform: scaleY(-1) translate(calc(var(--o-swap-translate) * -1), 0); }
    100%      { transform: scaleY(-1) translate(0, 0); }
  }

  body.mode-swap-3d .o-1 {
    animation: swap-3d-1 var(--interval) cubic-bezier(0.65, 0, 0.35, 1) 1 forwards;
  }
  body.mode-swap-3d .o-2 {
    animation: swap-3d-2 var(--interval) cubic-bezier(0.65, 0, 0.35, 1) 1 forwards;
  }
  body.mode-swap-3d .o-1-refl {
    animation: swap-3d-1-refl var(--interval) cubic-bezier(0.65, 0, 0.35, 1) 1 forwards;
  }
  body.mode-swap-3d .o-2-refl {
    animation: swap-3d-2-refl var(--interval) cubic-bezier(0.65, 0, 0.35, 1) 1 forwards;
  }
  @keyframes swap-3d-1 {
    0%, 50%   { transform: translate(0, 0) rotateY(0deg); }
    62%       { transform: translate(calc(var(--o-swap-translate) * 0.4), -30%) rotateY(180deg); }
    75%       { transform: translate(var(--o-swap-translate), 0) rotateY(360deg); }
    87%       { transform: translate(calc(var(--o-swap-translate) * 0.4), -30%) rotateY(540deg); }
    100%      { transform: translate(0, 0) rotateY(720deg); }
  }
  @keyframes swap-3d-2 {
    0%, 50%   { transform: translate(0, 0) rotateY(0deg); }
    62%       { transform: translate(calc(var(--o-swap-translate) * -0.4), 30%) rotateY(-180deg); }
    75%       { transform: translate(calc(var(--o-swap-translate) * -1), 0) rotateY(-360deg); }
    87%       { transform: translate(calc(var(--o-swap-translate) * -0.4), 30%) rotateY(-540deg); }
    100%      { transform: translate(0, 0) rotateY(-720deg); }
  }
  @keyframes swap-3d-1-refl {
    0%, 50%   { transform: scaleY(-1) translate(0, 0) rotateY(0deg); }
    62%       { transform: scaleY(-1) translate(calc(var(--o-swap-translate) * 0.4), -30%) rotateY(180deg); }
    75%       { transform: scaleY(-1) translate(var(--o-swap-translate), 0) rotateY(360deg); }
    87%       { transform: scaleY(-1) translate(calc(var(--o-swap-translate) * 0.4), -30%) rotateY(540deg); }
    100%      { transform: scaleY(-1) translate(0, 0) rotateY(720deg); }
  }
  @keyframes swap-3d-2-refl {
    0%, 50%   { transform: scaleY(-1) translate(0, 0) rotateY(0deg); }
    62%       { transform: scaleY(-1) translate(calc(var(--o-swap-translate) * -0.4), 30%) rotateY(-180deg); }
    75%       { transform: scaleY(-1) translate(calc(var(--o-swap-translate) * -1), 0) rotateY(-360deg); }
    87%       { transform: scaleY(-1) translate(calc(var(--o-swap-translate) * -0.4), 30%) rotateY(-540deg); }
    100%      { transform: scaleY(-1) translate(0, 0) rotateY(-720deg); }
  }

    mask-size: 100% 100%;

    mask-repeat: no-repeat;
    z-index: 3;
    opacity: 0;
  }

  /* === MOTION MODES === */

  body.mode-pulse .logo-wrap {
    animation: pulse-glow var(--interval) ease-in-out 1 forwards;
  }
  body.mode-pulse .pool {
    animation: pulse-pool var(--interval) ease-in-out 1 forwards;
  }
  @keyframes pulse-glow {
    0%, 70%, 100% {
      filter: drop-shadow(0 0 40px hsla(var(--glow-color), 80%, 50%, var(--glow-opacity)));
    }
    15% {
      filter: drop-shadow(0 0 80px hsla(var(--glow-color), 90%, 60%, calc(var(--glow-opacity) * 1.6)));
    }
  }
  @keyframes pulse-pool {
    0%, 70%, 100% { opacity: 1; transform: translate(-50%, -10%) scale(1); }
    15%           { opacity: 1.4; transform: translate(-50%, -10%) scale(1.15); }
  }

  body.mode-drift .horizon-line::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg,
      transparent 0%,
      hsla(var(--glow-color), 90%, 75%, 0.9) 50%,
      transparent 100%);
    width: 30%;
    height: 100%;
    transform: translateX(-100vw);
    animation: drift-glint var(--interval) linear 1 forwards;
  }
  @keyframes drift-glint {
    0%   { transform: translateX(-100vw); }
    100% { transform: translateX(100vw); }
  }

  body.mode-shimmer .shimmer-overlay {
    background: linear-gradient(110deg,
      transparent 0%, transparent 40%,
      rgba(255,255,255,0.9) 50%,
      transparent 60%, transparent 100%);
    background-size: 300% 100%;
    background-position: 200% 0;
    background-repeat: no-repeat;
    mix-blend-mode: overlay;
    opacity: 1;
    animation: shimmer-mask var(--interval) ease-in-out 1 forwards;
  }
  @keyframes shimmer-mask {
    0%, 30%   { background-position: 200% 0; }
    70%, 100% { background-position: -100% 0; }
  }

  body.mode-scan .scan-overlay {
    background: linear-gradient(180deg,
      transparent 0%, transparent 40%,
      hsla(var(--glow-color), 90%, 75%, 0.9) 49%,
      hsla(var(--glow-color), 100%, 90%, 1) 50%,
      hsla(var(--glow-color), 90%, 75%, 0.9) 51%,
      transparent 60%, transparent 100%);
    background-size: 100% 400%;
    background-position: 0 -100%;
    background-repeat: no-repeat;
    mix-blend-mode: screen;
    opacity: 1;
    animation: scan-mask var(--interval) ease-in-out 1 forwards;
  }
  @keyframes scan-mask {
    0%, 30%   { background-position: 0 -100%; }
    70%, 100% { background-position: 0 200%; }
  }

  body.mode-spin .logo-real,
  body.mode-spin .refl-animator {
    animation: spin var(--interval) cubic-bezier(0.65, 0, 0.35, 1) 1 forwards;
  }
  @keyframes spin {
    0%, 60%   { transform: rotateY(0deg); }
    100%      { transform: rotateY(360deg); }
  }

  body.mode-tilt .logo-real {
    animation: tilt var(--interval) cubic-bezier(0.65, 0, 0.35, 1) 1 forwards;
    transform-origin: bottom center;
  }
  body.mode-tilt .refl-animator {
    animation: tilt var(--interval) cubic-bezier(0.65, 0, 0.35, 1) 1 forwards;
    transform-origin: top center;
  }
  @keyframes tilt {
    0%, 50%, 100% { transform: rotateX(0deg); }
    65%           { transform: rotateX(20deg); }
    80%           { transform: rotateX(-15deg); }
  }

  body.mode-pop .logo-real {
    animation: pop var(--interval) cubic-bezier(0.34, 1.56, 0.64, 1) 1 forwards;
    transform-origin: bottom center;
  }
  body.mode-pop .refl-animator {
    animation: pop var(--interval) cubic-bezier(0.34, 1.56, 0.64, 1) 1 forwards;
    transform-origin: top center;
  }
  @keyframes pop {
    0%, 55%, 100% { transform: scale(1, 1); }
    65%           { transform: scale(0.85, 1.15); }
    72%           { transform: scale(1.15, 0.85); }
    80%           { transform: scale(0.95, 1.05); }
    88%           { transform: scale(1, 1); }
  }

  body.mode-stretch .logo-real,
  body.mode-stretch .refl-animator {
    animation: stretch var(--interval) cubic-bezier(0.65, 0, 0.35, 1) 1 forwards;
    transform-origin: center;
  }
  @keyframes stretch {
    0%, 55%, 100% { transform: scale(1, 1); }
    70%           { transform: scale(1.3, 0.9); }
    85%           { transform: scale(0.9, 1.05); }
  }

  body.mode-wobble .logo-real {
    animation: wobble var(--interval) cubic-bezier(0.36, 0, 0.66, -0.56) 1 forwards;
    transform-origin: bottom center;
  }
  body.mode-wobble .refl-animator {
    animation: wobble var(--interval) cubic-bezier(0.36, 0, 0.66, -0.56) 1 forwards;
    transform-origin: top center;
  }
  @keyframes wobble {
    0%, 50%, 100% { transform: rotate(0deg); }
    60%           { transform: rotate(4deg); }
    70%           { transform: rotate(-3deg); }
    80%           { transform: rotate(2deg); }
    90%           { transform: rotate(-1deg); }
  }

  body.mode-hue .logo-real,
  body.mode-hue .logo-no-o,
  body.mode-hue .logo-reflection,
  body.mode-hue .logo-reflection-no-o,
  body.mode-hue .o-piece,
  body.mode-hue .o-piece-refl {
    animation: hue-cycle calc(var(--interval) * 4) linear 1 forwards;
  }
  @keyframes hue-cycle {
    0%   { filter: hue-rotate(0deg); }
    100% { filter: hue-rotate(360deg); }
  }

  .grain {
    position: fixed;
    inset: 0;
    opacity: 0.04;
    mix-blend-mode: overlay;
    pointer-events: none;
    z-index: 10;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.6'/></svg>");
  }

  /* === Controls (hidden by default — see top of stylesheet) === */
  .controls {
    position: fixed;
    top: 16px; right: 16px;
    width: 300px;
    max-height: calc(100vh - 32px);
    background: rgba(15, 15, 20, 0.92);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    padding: 16px;
    z-index: 100;
    overflow-y: auto;
    font-size: 12px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  .controls.collapsed .panel-body { display: none; }

  .panel-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px; padding-bottom: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .panel-title {
    font-weight: 600; letter-spacing: 1px; text-transform: uppercase;
    font-size: 11px; color: #5dd4f0;
  }
  .toggle-btn {
    background: rgba(255,255,255,0.08); border: none; color: #fff;
    width: 24px; height: 24px; border-radius: 6px; cursor: pointer; font-size: 14px;
  }
  .toggle-btn:hover { background: rgba(255,255,255,0.15); }

  .section { margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .section:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

  .section-title {
    font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px;
    color: rgba(255,255,255,0.5); margin-bottom: 8px;
  }

  .control-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .control-label { flex: 0 0 90px; font-size: 11px; color: rgba(255,255,255,0.7); }
  .control-value {
    flex: 0 0 42px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10px; color: #5dd4f0; text-align: right;
  }

  input[type="range"] {
    flex: 1; -webkit-appearance: none; appearance: none;
    height: 3px; background: rgba(255,255,255,0.15); border-radius: 2px; outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 12px; height: 12px; border-radius: 50%; background: #5dd4f0; cursor: pointer;
  }
  input[type="range"]::-moz-range-thumb {
    width: 12px; height: 12px; border-radius: 50%; background: #5dd4f0; cursor: pointer; border: none;
  }

  .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .mode-btn {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.7);
    padding: 8px; border-radius: 6px; cursor: pointer;
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px;
    font-family: inherit;
  }
  .mode-btn:hover { background: rgba(255,255,255,0.1); }
  .mode-btn.active {
    background: rgba(93, 212, 240, 0.15);
    border-color: rgba(93, 212, 240, 0.5);
    color: #5dd4f0;
  }

  .button-row { display: flex; gap: 6px; margin-top: 8px; }
  .btn {
    flex: 1;
    background: rgba(93, 212, 240, 0.12);
    border: 1px solid rgba(93, 212, 240, 0.3);
    color: #5dd4f0;
    padding: 6px 8px; border-radius: 6px; cursor: pointer;
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px;
    font-family: inherit;
  }
  .btn:hover { background: rgba(93, 212, 240, 0.2); }
  .btn.danger {
    background: rgba(220, 80, 100, 0.1);
    border-color: rgba(220, 80, 100, 0.3);
    color: #e88090;
  }

  .css-output {
    width: 100%; background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.1);
    color: #5dd4f0;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 10px; padding: 8px; border-radius: 6px;
    resize: none; height: 100px; margin-top: 6px; box-sizing: border-box;
  }

  .toggle-switch {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .toggle-switch input { margin: 0; }
</style>
</head>
<body class="mode-pulse">

  <div class="floor"></div>
  <div class="pool"></div>

  <div class="grain"></div>

  <div class="controls" id="controls">
    <div class="panel-header">
      <div class="panel-title">Glass Controls</div>
      <button class="toggle-btn" onclick="togglePanel()">&minus;</button>
    </div>
    <div class="panel-body">

      <div class="section">
        <div class="section-title">Rotation</div>
        <div class="toggle-switch">
          <input type="checkbox" id="rotateToggle" checked onchange="toggleRotation()">
          <label for="rotateToggle" style="font-size:11px;color:rgba(255,255,255,0.7);">Random rotation</label>
        </div>
        <div class="control-row" style="margin-top:8px;">
          <span class="control-label">Switch every</span>
          <input type="range" min="10" max="300" step="5" value="60" data-var="--cycle" data-suffix="s">
          <span class="control-value" data-display="--cycle">60s</span>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Motion Mode</div>
        <div class="mode-grid">
          <button class="mode-btn active" data-mode="pulse" onclick="setMode(this, true)">Pulse</button>
          <button class="mode-btn" data-mode="drift" onclick="setMode(this, true)">Drift</button>
          <button class="mode-btn" data-mode="shimmer" onclick="setMode(this, true)">Shimmer</button>
          <button class="mode-btn" data-mode="scan" onclick="setMode(this, true)">Scan</button>
          <button class="mode-btn" data-mode="swap" onclick="setMode(this, true)">Swap O's</button>
          <button class="mode-btn" data-mode="swap-3d" onclick="setMode(this, true)">Swap O's 3D</button>
          <button class="mode-btn" data-mode="spin" onclick="setMode(this, true)">Spin</button>
          <button class="mode-btn" data-mode="tilt" onclick="setMode(this, true)">Tilt</button>
          <button class="mode-btn" data-mode="pop" onclick="setMode(this, true)">Pop</button>
          <button class="mode-btn" data-mode="stretch" onclick="setMode(this, true)">Stretch</button>
          <button class="mode-btn" data-mode="wobble" onclick="setMode(this, true)">Wobble</button>
          <button class="mode-btn" data-mode="hue" onclick="setMode(this, true)">Hue Shift</button>
          <button class="mode-btn" data-mode="none" onclick="setMode(this, true)">Still</button>
        </div>
        <div class="control-row" style="margin-top:10px;">
          <span class="control-label">Animation</span>
          <input type="range" min="2" max="20" step="1" value="5" data-var="--interval" data-suffix="s">
          <span class="control-value" data-display="--interval">5s</span>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Layout</div>
        <div class="control-row">
          <span class="control-label">Logo width</span>
          <input type="range" min="20" max="95" step="1" value="53" data-var="--logo-width" data-suffix="%">
          <span class="control-value" data-display="--logo-width">53%</span>
        </div>
        <div class="control-row">
          <span class="control-label">Horizon</span>
          <input type="range" min="30" max="80" step="1" value="49" data-var="--horizon" data-suffix="%">
          <span class="control-value" data-display="--horizon">49%</span>
        </div>
        <div class="control-row">
          <span class="control-label">Gap</span>
          <input type="range" min="0" max="40" step="1" value="18" data-var="--gap" data-suffix="px">
          <span class="control-value" data-display="--gap">18px</span>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Reflection</div>
        <div class="control-row">
          <span class="control-label">Opacity</span>
          <input type="range" min="0" max="1" step="0.02" value="0.3" data-var="--reflection-opacity">
          <span class="control-value" data-display="--reflection-opacity">0.30</span>
        </div>
        <div class="control-row">
          <span class="control-label">Blur</span>
          <input type="range" min="0" max="8" step="0.5" value="1" data-var="--reflection-blur" data-suffix="px">
          <span class="control-value" data-display="--reflection-blur">1px</span>
        </div>
        <div class="control-row">
          <span class="control-label">Fade top</span>
          <input type="range" min="0" max="1" step="0.05" value="1" data-var="--refl-fade-start">
          <span class="control-value" data-display="--refl-fade-start">1.00</span>
        </div>
        <div class="control-row">
          <span class="control-label">Fade mid</span>
          <input type="range" min="0" max="1" step="0.05" value="0.4" data-var="--refl-fade-mid">
          <span class="control-value" data-display="--refl-fade-mid">0.40</span>
        </div>
        <div class="control-row">
          <span class="control-label">Mid at</span>
          <input type="range" min="10" max="80" step="1" value="35" data-var="--refl-fade-mid-pos" data-suffix="%">
          <span class="control-value" data-display="--refl-fade-mid-pos">35%</span>
        </div>
        <div class="control-row">
          <span class="control-label">Fade end</span>
          <input type="range" min="30" max="100" step="1" value="85" data-var="--refl-fade-end-pos" data-suffix="%">
          <span class="control-value" data-display="--refl-fade-end-pos">85%</span>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Glow</div>
        <div class="control-row">
          <span class="control-label">Strength</span>
          <input type="range" min="0" max="1" step="0.05" value="0.35" data-var="--glow-opacity">
          <span class="control-value" data-display="--glow-opacity">0.35</span>
        </div>
        <div class="control-row">
          <span class="control-label">Hue</span>
          <input type="range" min="0" max="360" step="1" value="209" data-var="--glow-color">
          <span class="control-value" data-display="--glow-color">209</span>
        </div>
      </div>

      <div class="section">
        <div class="button-row">
          <button class="btn" onclick="copyCSS()">Copy CSS</button>
          <button class="btn danger" onclick="resetAll()">Reset</button>
        </div>
        <textarea class="css-output" id="cssOutput" readonly></textarea>
      </div>
    </div>
  </div>

<script>
  // ===== Mode rotation =====
  // Reads --cycle from CSS :root (how often to switch modes).
  // --interval drives the animation duration (how long each effect takes).
  function getCycleMs() {
    const val = getComputedStyle(document.documentElement)
      .getPropertyValue('--cycle').trim();
    const num = parseFloat(val);
    return isNaN(num) ? 60000 : num * 1000;
  }

  const MODES = ['pulse', 'drift', 'shimmer', 'scan', 'swap', 'swap-3d',
                 'spin', 'tilt', 'pop', 'stretch', 'wobble', 'hue'];
  let rotationEnabled = true;
  let rotationTimer = null;
  let lastMode = 'pulse';

  function pickRandomMode() {
    // Pick a mode that's different from the current one
    let next;
    do {
      next = MODES[Math.floor(Math.random() * MODES.length)];
    } while (next === lastMode && MODES.length > 1);
    lastMode = next;
    return next;
  }

  function applyMode(mode) {
    console.log('[woozlescape] Applying mode:', mode);
    document.body.className = 'mode-' + mode;
    // Update active button if controls visible
    document.querySelectorAll('.mode-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.mode === mode);
    });
  }

  function getRotateIntervalMs() {
    return getCycleMs();
  }

  function startRotation() {
    if (rotationTimer) clearInterval(rotationTimer);
    if (!rotationEnabled) return;
    rotationTimer = setInterval(() => {
      applyMode(pickRandomMode());
    }, getRotateIntervalMs());
  }

  function stopRotation() {
    if (rotationTimer) clearInterval(rotationTimer);
    rotationTimer = null;
  }

  // Wait until DOM is fully ready, then kick off
  function init() {
    console.log('[woozlescape] Initializing. Cycle:', getCycleMs(), 'ms');
    applyMode(pickRandomMode());
    startRotation();
  }

  // Re-trigger animation when mode switches by toggling a class.
  // Otherwise CSS animations only run on initial paint with `1 forwards`.
  // We do this by removing then re-adding the body class on each switch.
  // (applyMode already does this via className=, which is enough — the
  // animation will play because the new class brings new animation rules.)

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }

  // ===== Controls (only active when panel is shown) =====
  const root = document.documentElement;
  const sliders = document.querySelectorAll('input[type="range"]');

  function updateDisplay(slider) {
    const varName = slider.dataset.var;
    const suffix = slider.dataset.suffix || '';
    const display = document.querySelector(`[data-display="${varName}"]`);
    if (!display) return;
    let val = slider.value;
    if (suffix) display.textContent = val + suffix;
    else if (varName.includes('opacity')) display.textContent = parseFloat(val).toFixed(2);
    else display.textContent = val;
    root.style.setProperty(varName, val + suffix);

    // If the cycle interval changed, restart the rotation timer
    if (varName === '--cycle') {
      startRotation();
    }
    updateCSSOutput();
  }

  sliders.forEach(slider => slider.addEventListener('input', () => updateDisplay(slider)));

  function setMode(btn, manual) {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.body.className = 'mode-' + btn.dataset.mode;
    lastMode = btn.dataset.mode;
    if (manual) {
      // Manual selection pauses rotation until next interval boundary
      startRotation();
    }
    updateCSSOutput();
  }

  function toggleRotation() {
    const cb = document.getElementById('rotateToggle');
    rotationEnabled = cb.checked;
    if (rotationEnabled) {
      startRotation();
    } else {
      stopRotation();
    }
  }

  function togglePanel() {
    const panel = document.getElementById('controls');
    panel.classList.toggle('collapsed');
    const btn = panel.querySelector('.toggle-btn');
    btn.innerHTML = panel.classList.contains('collapsed') ? '+' : '&minus;';
  }

  function resetAll() {
    const defaults = {
      '--logo-width': 53, '--horizon': 49, '--gap': 18,
      '--reflection-opacity': 0.3, '--reflection-blur': 1,
      '--glow-opacity': 0.35, '--glow-color': 209, '--interval': 5, '--cycle': 60,
      '--refl-fade-start': 1, '--refl-fade-mid': 0.4,
      '--refl-fade-mid-pos': 35, '--refl-fade-end-pos': 85
    };
    Object.entries(defaults).forEach(([key, val]) => {
      const slider = document.querySelector(`[data-var="${key}"]`);
      if (slider) { slider.value = val; updateDisplay(slider); }
    });
  }

  function updateCSSOutput() {
    const out = document.getElementById('cssOutput');
    if (!out) return;
    let css = ':root {\n';
    sliders.forEach(slider => {
      const suffix = slider.dataset.suffix || '';
      css += `  ${slider.dataset.var}: ${slider.value}${suffix};\n`;
    });
    css += '}';
    out.value = css;
  }

  function copyCSS() {
    const out = document.getElementById('cssOutput');
    out.select();
    document.execCommand('copy');
    const btn = event.target;
    const orig = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = orig, 1200);
  }

  updateCSSOutput();
</script>
</body>
</html>
