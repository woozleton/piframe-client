# Known frames: Raspberry Pi board serial -> hostname.
#
# Read by piframe-firstboot when a card boots in a Pi it hasn't seen
# before (a cloned card, or a card moved to another board). A listed
# board gets its name back - so re-flashing an existing frame from the
# template image keeps its identity in the manager and Home Assistant.
# An unlisted board becomes piclient-<last 6 of its Wi-Fi MAC>.
#
# Serial: tr -d '\0' < /sys/firmware/devicetree/base/serial-number
